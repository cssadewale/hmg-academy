<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Tutor | HMG Academy — Join the Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>body { font-family: 'Inter', system_ui, sans-serif; } .navy-bg { background-color: #0a1628; } .premium-card { background-color: #1e2937; border: 1px solid #334155; }</style>
</head>
<body class="bg-[#0a1628] text-[#f8fafc] navy-bg">
    <nav class="bg-[#0a1628]/95 backdrop-blur-md border-b border-[#334155] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6"><div class="flex justify-between items-center h-16">
            <div class="flex items-center gap-3"><img src="assets/images/hmg-academy-logo.png" alt="HMG Academy Logo" class="h-9 w-auto" onerror="this.style.display='none'"><span class="font-bold">HMG Academy</span></div>
            <div class="hidden md:flex items-center gap-6 text-sm"><a href="index.html" class="hover:text-[#eab308]">Home</a><a href="services.html" class="hover:text-[#eab308]">Services</a><a href="book-tutor.html" class="hover:text-[#eab308]">Find a Tutor</a><a href="contact.html" class="hover:text-[#eab308]">Contact</a></div>
            <a href="https://wa.me/2348100866322" target="_blank" class="px-4 py-2 bg-[#eab308] text-[#0a1628] text-sm font-semibold rounded-2xl flex items-center gap-2"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        </div></div>
    </nav>

    <div class="max-w-lg mx-auto px-6 py-12">
        <h1 class="text-4xl font-bold">Become a Tutor</h1>
        <p class="mt-2 text-[#cbd5e1]">Join our vetted network. Access training, foreign gigs, and uplift learners (LTU programs). Top 1% only.</p>

        <form id="tutor-form" class="mt-8 premium-card p-6 rounded-3xl space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-xs mb-1 text-[#94a3b8]">Full Name</label><input type="text" name="Full Name" required class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm"></div>
                <div><label class="block text-xs mb-1 text-[#94a3b8]">Phone / WhatsApp</label><input type="tel" name="Phone" required class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm"></div>
            </div>
            <div><label class="block text-xs mb-1 text-[#94a3b8]">Email</label><input type="email" name="Email" class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm"></div>
            <div><label class="block text-xs mb-1 text-[#94a3b8]">Highest Qualification</label><input type="text" name="Qualification" required class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm"></div>
            <div><label class="block text-xs mb-1 text-[#94a3b8]">Subjects You Can Teach (comma separated)</label><input type="text" name="Subjects" required placeholder="Mathematics, Physics, IELTS, WAEC English..." class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm"></div>
            <div><label class="block text-xs mb-1 text-[#94a3b8]">Years of Teaching Experience</label><input type="text" name="Experience" class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm"></div>
            <div><label class="block text-xs mb-1 text-[#94a3b8]">Preferred Mode (Home, Online, Virtual)</label><input type="text" name="Preferred Mode" class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm"></div>
            <div><label class="block text-xs mb-1 text-[#94a3b8]">Why do you want to join? (short bio)</label><textarea name="Bio" rows="3" class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm" placeholder="Passionate about..."></textarea></div>
            <button type="submit" class="w-full py-3 bg-[#eab308] hover:bg-[#facc15] text-[#0a1628] font-semibold rounded-3xl">Submit Application (Opens WhatsApp)</button>
            <p class="text-[10px] text-center text-[#64748b]">We will contact you for vetting (exam + interview + background). Training &amp; upliftment programs included.</p>
        </form>
    </div>

    <script>
        document.getElementById('tutor-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            let message = "Hello HMG Academy,%0A%0A*New Tutor Application*%0A%0A";
            for (let [key, value] of formData.entries()) {
                message += `${key}: ${value}%0A`;
            }
            window.open(`https://wa.me/2348100866322?text=${message}`, '_blank');
        });
    </script>
</body>
</html>
