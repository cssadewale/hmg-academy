<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register / Enrol | HMG Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>body { font-family: 'Inter', system_ui, sans-serif; } .navy-bg { background-color: #0a1628; } .premium-card { background-color: #1e2937; border: 1px solid #334155; }</style>
</head>
<body class="bg-[#0a1628] text-[#f8fafc] navy-bg">
    <nav class="bg-[#0a1628]/95 backdrop-blur-md border-b border-[#334155] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6"><div class="flex justify-between items-center h-16">
            <div class="flex items-center gap-3"><img src="assets/images/hmg-academy-logo.png" alt="HMG Academy Logo" class="h-9 w-auto" onerror="this.style.display='none'"><span class="font-bold">HMG Academy</span></div>
            <div class="hidden md:flex items-center gap-6 text-sm"><a href="index.html" class="hover:text-[#eab308]">Home</a><a href="services.html" class="hover:text-[#eab308]">Services</a><a href="tools.html" class="hover:text-[#eab308]">Tools</a><a href="homeschooling.html" class="hover:text-[#eab308]">Home Schooling</a></div>
            <a href="https://wa.me/2348100866322" target="_blank" class="px-4 py-2 bg-[#eab308] text-[#0a1628] text-sm font-semibold rounded-2xl flex items-center gap-2"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        </div></div>
    </nav>

    <div class="max-w-lg mx-auto px-6 py-12">
        <h1 class="text-4xl font-bold">Register / Enrol</h1>
        <p class="text-[#94a3b8] mt-2">Fill the form. We will contact you on WhatsApp immediately with next steps.</p>

        <form id="enrol-form" class="mt-8 space-y-4 premium-card p-6 rounded-3xl">
            <div>
                <label class="block text-xs mb-1 text-[#94a3b8]">Full Name</label>
                <input type="text" name="Full Name" required class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs mb-1 text-[#94a3b8]">Phone / WhatsApp</label>
                    <input type="tel" name="Phone" required class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm">
                </div>
                <div>
                    <label class="block text-xs mb-1 text-[#94a3b8]">Email</label>
                    <input type="email" name="Email" class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm">
                </div>
            </div>
            <div>
                <label class="block text-xs mb-1 text-[#94a3b8]">I am a...</label>
                <select name="Role" required class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm">
                    <option value="">Select</option>
                    <option>Parent / Guardian</option>
                    <option>Student</option>
                    <option>School / Institution</option>
                    <option>Teacher</option>
                    <option>Other</option>
                </select>
            </div>
            <div>
                <label class="block text-xs mb-1 text-[#94a3b8]">Programme / Level</label>
                <select name="Programme" required class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm">
                    <option value="">Select</option>
                    <option>Virtual Home Schooling (Nursery–Primary)</option>
                    <option>Virtual Home Schooling (JSS1–JSS3)</option>
                    <option>Virtual Home Schooling (SSS1–SSS3)</option>
                    <option>CBT Pro for my School</option>
                    <option>LMS / Data Science Training</option>
                    <option>Exam Prep (WAEC/NECO/IGCSE etc.)</option>
                    <option>School Partnership / Enterprise</option>
                    <option>Other</option>
                </select>
            </div>
            <div>
                <label class="block text-xs mb-1 text-[#94a3b8]">Subjects or Specific Needs</label>
                <textarea name="Message" rows="3" class="w-full bg-[#0f172a] border border-[#334155] rounded-2xl px-4 py-3 text-sm" placeholder="E.g. Further Maths + Physics, WAEC 2026"></textarea>
            </div>
            
            <button type="submit" class="w-full py-3 bg-[#eab308] hover:bg-[#facc15] text-[#0a1628] font-semibold rounded-3xl">Submit &amp; Open WhatsApp</button>
            <p class="text-[10px] text-center text-[#64748b]">Your details are sent only via WhatsApp. No data stored on our servers.</p>
        </form>
    </div>

    <script>
        document.getElementById('enrol-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            let message = "Hello HMG Academy,%0A%0A*New Enrolment Enquiry*%0A%0A";
            for (let [key, value] of formData.entries()) {
                message += `${key}: ${value}%0A`;
            }
            message += "%0APlease reply with next steps. Thank you!";
            window.open(`https://wa.me/2348100866322?text=${message}`, '_blank');
        });
    </script>
</body>
</html>
